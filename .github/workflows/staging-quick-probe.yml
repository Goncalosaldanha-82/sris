name: SRIS staging quick probe

on:
  push:
    branches:
      - qa-staging-deep-audit-20260902
    paths:
      - ".github/workflows/staging-quick-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Probe public domains and candidate routes
        shell: bash
        run: |
          set -u
          urls=(
            "https://sris.io/"
            "https://www.sris.io/"
            "https://app.sris.io/"
            "https://app.sris.io/demonstracao"
            "https://sris-mission-intelligence.up.railway.app/"
            "https://sris-pilot-v1-staging.up.railway.app/"
            "https://sris-pilot-v1-staging.up.railway.app/demonstracao"
          )
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            curl --connect-timeout 10 --max-time 35 -sS -L --max-redirs 6 -D /tmp/h -o /tmp/b -w 'FINAL_URL=%{url_effective}\nSTATUS=%{http_code}\nTIME=%{time_total}\n' "$url" || true
            sed -n '1,35p' /tmp/h || true
            echo "BODY_BYTES=$(wc -c < /tmp/b 2>/dev/null || echo 0)"
            head -c 500 /tmp/b 2>/dev/null | tr '\n' ' ' || true
            echo
          done
