name: Repair Pilot V1 workspace continuity

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/workspace-continuity-repair.yml"

permissions:
  contents: write

env:
  ATLAS_DATABASE_URL: sqlite+pysqlite:////tmp/sris-workspace-continuity.db
  ATLAS_REPOSITORY_ROOT: /tmp/sris-workspace-repository
  ATLAS_JWT_SECRET: atlas-workspace-continuity-test-secret-over-32-bytes
  ATLAS_ENV: test
  SRIS_PILOT_MODE: "true"
  SRIS_PUBLIC_SIGNUP_ENABLED: "true"

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Apply workspace continuity repair
        run: |
          python tools/workspace_continuity_repair.py
          python - <<'PY'
          from pathlib import Path

          html_path = Path("frontend/pilot-v1/index.html")
          html = html_path.read_text(encoding="utf-8")
          old_copy = "Este portefólio mostra as missões do workspace selecionado. Missões de outro workspace aparecem quando esse espaço é escolhido."
          new_copy = "As missões anteriores permanecem preservadas no respetivo workspace. Este portefólio mostra apenas as missões do espaço selecionado; para consultar outro, escolha-o no seletor de workspace."
          if html.count(old_copy) != 1:
              raise RuntimeError("Workspace continuity copy was not generated as expected")
          html_path.write_text(html.replace(old_copy, new_copy, 1), encoding="utf-8")

          test_path = Path("frontend/tests/workspace_selection_contract.test.js")
          test = test_path.read_text(encoding="utf-8")
          old_assertion = "assert.match(html, /workspace selecionado/);"
          new_assertion = "assert.match(html, /espaço selecionado/);"
          if test.count(old_assertion) != 1:
              raise RuntimeError("Workspace continuity assertion was not generated as expected")
          test_path.write_text(test.replace(old_assertion, new_assertion, 1), encoding="utf-8")
          PY
          git checkout -- .github/workflows/atlas-core-ci.yml

      - name: Prepare validation environment
        run: |
          rm -f /tmp/sris-workspace-continuity.db
          mkdir -p /tmp/sris-workspace-repository
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m alembic upgrade head

      - name: Validate syntax and workspace contracts
        run: |
          python -m compileall -q backend/app backend/tests
          node --check frontend/pilot-v1/app.js
          node --check frontend/pilot-v1/pilot-platform-v1.js
          node --test frontend/tests/*.test.js
          python -m pytest -q backend/tests/test_workspace_selection.py
          python -m pytest -q backend/tests/test_pilot_v1_contract.py

      - name: Commit validated application repair
        run: |
          git rm tools/workspace_continuity_repair.py
          git add \
            backend/app/atlas_platform/database.py \
            backend/app/atlas_platform/workspace_scope.py \
            backend/app/main.py \
            backend/app/pilot_capabilities.py \
            backend/app/pilot_product.py \
            backend/tests/test_workspace_selection.py \
            frontend/pilot-v1/app.js \
            frontend/pilot-v1/index.html \
            frontend/pilot-v1/pilot-platform-v1.js \
            frontend/pilot-v1/pilot.css \
            frontend/tests/workspace_selection_contract.test.js
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore explicit workspace continuity across Pilot V1"
          git push origin HEAD:pilot-v1-september-2026
