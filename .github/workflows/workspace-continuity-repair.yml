name: Repair Pilot V1 workspace continuity

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/workspace-continuity-repair.yml"

permissions:
  contents: write

env:
  ATLAS_DATABASE_URL: sqlite+pysqlite:////tmp/sris-workspace-continuity.db
  ATLAS_REPOSITORY_ROOT: /tmp/sris-workspace-repository
  ATLAS_JWT_SECRET: atlas-workspace-continuity-test-secret-over-32-bytes
  ATLAS_ENV: test
  SRIS_PILOT_MODE: "true"
  SRIS_PUBLIC_SIGNUP_ENABLED: "true"

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Apply workspace continuity repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one literal match, found {count}")
              write(path, text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one regex match, found {count}")
              write(path, updated)

          write(
              "backend/app/atlas_platform/workspace_scope.py",
