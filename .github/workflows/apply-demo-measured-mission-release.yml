name: Prepare measured-mission demonstration release

on:
  push:
    branches:
      - demo-release-90d-measured-mission-20260905
    paths:
      - ".github/workflows/apply-demo-measured-mission-release.yml"
      - "tools/apply_demo_measured_mission_release.py"
      - "tools/fix_demo_test_contract.py"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out temporary release branch
        uses: actions/checkout@v4
        with:
          ref: demo-release-90d-measured-mission-20260905
          fetch-depth: 0

      - name: Apply exact demonstration changes
        run: |
          python tools/apply_demo_measured_mission_release.py
          python tools/fix_demo_test_contract.py

      - name: Validate source contracts
        run: |
          python -m compileall -q backend/app backend/tests
          node --check frontend/pilot-v1/demonstracao.js
          node --test frontend/tests/public_demonstration_contract.test.js

      - name: Commit clean candidate
        run: |
          git rm .github/workflows/apply-demo-measured-mission-release.yml
          git rm tools/apply_demo_measured_mission_release.py
          git rm tools/fix_demo_test_contract.py
          git add backend frontend
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align demonstration with 90-day measured-mission offer"
          git push origin HEAD:demo-release-90d-measured-mission-20260905
