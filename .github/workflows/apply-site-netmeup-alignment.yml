name: Apply SRIS site Net Me Up alignment

on:
  push:
    branches:
      - release-site-netmeup-alignment-20260905-final
    paths:
      - .github/workflows/apply-site-netmeup-alignment.yml
      - tools/apply_site_alignment.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: release-site-netmeup-alignment-20260905-final
          fetch-depth: 0

      - name: Apply coordinated site changes
        run: python tools/apply_site_alignment.py

      - name: Run site tests and local routing probes
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_contact_server.py
          python -m py_compile contact_server.py
          PORT=8091 SRIS_PUBLIC_DEMO_URL=https://app.sris.io/demonstracao python contact_server.py >/tmp/sris-site.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8091/health >/dev/null; then break; fi
            sleep 0.25
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: www.sris.io' http://127.0.0.1:8091/)" = "301"
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' -H 'Host: www.sris.io' http://127.0.0.1:8091/)" = "https://sris.io/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/demonstracao)" = "302"
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8091/demonstracao)" = "https://app.sris.io/demonstracao"
          grep -F 'contact@sris.io' site/index.html
          grep -F '<link rel="canonical" href="https://sris.io/">' site/index.html
          ! grep -F 'sris-pilot-v1-staging.up.railway.app/demonstracao' site/index.html

      - name: Commit one deployable site release
        run: |
          git rm .github/workflows/apply-site-netmeup-alignment.yml
          git rm tools/apply_site_alignment.py
          git add site/index.html contact_server.py test_contact_server.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align pilot scope and canonical public routes"
          git push origin HEAD:release-site-netmeup-alignment-20260905-final
