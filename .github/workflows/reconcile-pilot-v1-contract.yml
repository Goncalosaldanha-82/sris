name: Reconcile obsolete Pilot V1 contract assertions

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/reconcile-pilot-v1-contract.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Replace obsolete eleven-step assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/test_pilot_v1_contract.py")
          text = path.read_text(encoding="utf-8")

          old_markers = '''        "Aprendizagens publicadas",
                  "Observação",
                  "Evidência",
                  "Hipótese",
                  "Alternativa",
                  "Decisão",
                  "Ação",
                  "Resultado",
                  "Aprendizagem",
                  "Pressupostos",'''
          new_markers = '''        "Aprendizagens publicadas",
                  "MOMENTO 1 DE 5",
                  "Contexto",
                  "Evidência",
                  "Decisão",
                  "Medição",
                  "Memória",
                  "Pressupostos",'''
          if old_markers not in text:
              raise RuntimeError("Static workspace marker block not found")
          text = text.replace(old_markers, new_markers, 1)

          old_chain = '''    assert payload["canonical_mission_chain"] == [
                  "context", "observation", "evidence", "hypothesis", "alternatives",
                  "decision", "action", "measurement", "outcome", "learning", "memory",
              ]'''
          new_chain = '''    assert payload["user_moments"] == [
                  "context", "evidence", "decision", "measurement", "memory",
              ]
              assert payload["canonical_records"] == [
                  "observation", "evidence", "hypothesis", "alternative",
                  "decision", "action", "outcome", "learning",
              ]
              assert payload["canonical_mission_chain"] == payload["canonical_records"]
              assert payload["profile_count"] == 6
              assert payload["configurable_sector_profiles"] == [
                  "cross_sector",
                  "hospitality",
                  "public_sector",
                  "industrial_operations",
                  "territorial_lab",
                  "research_and_innovation",
              ]
              assert "tourism_advance" in payload["program_sources"]
              assert "hospitality_open_innovation" in payload["program_sources"]'''
          if old_chain not in text:
              raise RuntimeError("Obsolete canonical mission chain assertion not found")
          text = text.replace(old_chain, new_chain, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove this one-shot workflow and commit
        run: |
          git rm .github/workflows/reconcile-pilot-v1-contract.yml
          git add backend/tests/test_pilot_v1_contract.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align Pilot V1 contracts with five moments and eight records"
          git push origin HEAD:pilot-v1-september-2026
