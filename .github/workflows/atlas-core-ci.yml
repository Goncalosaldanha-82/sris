name: ATLAS Core CI
on:
  workflow_dispatch:
  push:
    branches: [feature/ske-core, main]
    paths: ["backend/**", "migrations/**", "pyproject.toml", "alembic.ini", ".github/workflows/atlas-core-ci.yml"]
  pull_request:
    paths: ["backend/**", "migrations/**", "pyproject.toml", "alembic.ini"]
permissions:
  contents: read
jobs:
  core-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]"
      - run: python -c "import app; import app.main; print('ATLAS Core import OK')"
      - run: python -m pytest backend/tests/test_alembic_migrations.py
      - run: python -m pytest backend/tests/test_atlas_repository_engine.py
      - run: python -m pytest backend/tests/test_atlas_platform_workflow.py
      - run: python -m alembic heads
