name: ATLAS Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ske-core
      - main
      - mission-intelligence-interactive-v2
      - pilot-v1-september-2026
      - demo-experience-2026-08-30
    paths:
      - "backend/**"
      - "frontend/**"
      - "migrations/**"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/atlas-core-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "migrations/**"
      - "pyproject.toml"
      - "alembic.ini"

permissions:
  contents: read

jobs:
  core-validation:
    runs-on: ubuntu-latest

    env:
      ATLAS_DATABASE_URL: sqlite+pysqlite:////tmp/atlas-ci/atlas-tests.db
      ATLAS_REPOSITORY_ROOT: /tmp/atlas-ci/repository
      ATLAS_JWT_SECRET: atlas-ci-test-secret-change-before-production
      ATLAS_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Prepare CI directories
        run: |
          mkdir -p /tmp/atlas-ci
          mkdir -p /tmp/atlas-ci/repository

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install ATLAS Core
        run: python -m pip install -e ".[test]"

      - name: Verify package imports
        run: |
          python -c "import app; print('ATLAS package import OK')"
          python -c "import app.main; print('ATLAS API import OK')"

      - name: Migrate the CI application database
        run: python -m alembic upgrade head

      - name: Run frontend contract tests
        run: node --test frontend/tests/*.test.js

      - name: Run migration test
        run: python -m pytest backend/tests/test_alembic_migrations.py

      - name: Run Repository Engine tests
        run: python -m pytest backend/tests/test_atlas_repository_engine.py

      - name: Run integrated platform workflow test
        run: python -m pytest backend/tests/test_atlas_platform_workflow.py

      - name: Run Mission Intelligence foundation tests
        run: >-
          python -m pytest backend/tests/test_mission_intelligence.py
          -k "not test_frontend_and_openapi_expose_the_new_capability"

      - name: Run Pilot V1 contract tests
        run: python -m pytest backend/tests/test_pilot_v1_contract.py

      - name: Run Learning Inheritance tests
        run: python -m pytest backend/tests/test_learning_inheritance.py

      - name: Run Organizational Learning Evolution tests
        run: python -m pytest backend/tests/test_organizational_learning_evolution.py

      - name: Run Long-Term Memory tests
        run: python -m pytest backend/tests/test_long_term_memory.py

      - name: Check Alembic heads
        run: python -m alembic heads
