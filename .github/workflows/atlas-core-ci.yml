name: ATLAS Core CI

on:
  push:
    branches:
      - main
      - phase-2-operationalization
      - pilot-v1-september-2026
  pull_request:

permissions:
  contents: write

env:
  ATLAS_DATABASE_URL: sqlite+pysqlite:////tmp/atlas-ci/atlas-tests.db
  ATLAS_REPOSITORY_ROOT: /tmp/atlas-ci/repository
  ATLAS_JWT_SECRET: atlas-ci-test-secret-change-before-production
  ATLAS_ENV: test

jobs:
  repair-release-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot-v1-september-2026'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply the authorized reconciliation
        run: |
          python tools/pilot_release_repair.py
          git checkout -- .github/workflows/atlas-core-ci.yml

      - name: Install validation dependencies
        run: |
          mkdir -p /tmp/atlas-ci/repository
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Validate corrected product and migration path
        run: |
          python -m compileall -q backend/app backend/tests migrations
          node --check frontend/pilot-v1/app.js
          node --check frontend/pilot-v1/pilot-platform-v1.js
          node --check frontend/pilot-v1/pilot-value-v1.js
          node --check frontend/pilot-v1/pilot-mission-bridge-v1.js
          rm -f /tmp/atlas-ci/atlas-tests.db
          python -m alembic upgrade 20260827_0022
          python -m alembic upgrade head
          python -m alembic current -v
          python -m alembic heads -v
          node --test frontend/tests/*.test.js
          python -m pytest -q backend/tests/test_alembic_migrations.py
          python -m pytest -q backend/tests/test_pilot_platform.py
          python -m pytest -q backend/tests/test_pilot_value.py
          python -m pytest -q backend/tests/test_pilot_tenant_isolation.py
          python -m pytest -q backend/tests/test_identity_lifecycle.py

      - name: Commit the repaired candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend migrations Dockerfile
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Candidate already reconciled."
            exit 0
          fi
          git commit -m "fix: reconcile the integrated pilot release candidate"
          git push origin HEAD:pilot-v1-september-2026

  core-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare CI directories
        run: |
          mkdir -p /tmp/atlas-ci
          mkdir -p /tmp/atlas-ci/repository

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install ATLAS Core
        run: python -m pip install -e ".[test]"

      - name: Verify package imports
        run: |
          python -c "import app; print('ATLAS package import OK')"
          python -c "import app.main; print('ATLAS API import OK')"

      - name: Migrate the CI application database
        run: python -m alembic upgrade head

      - name: Run frontend contract tests
        run: node --test frontend/tests/*.test.js

      - name: Run migration test
        run: python -m pytest backend/tests/test_alembic_migrations.py

      - name: Run Repository Engine tests
        run: python -m pytest backend/tests/test_atlas_repository_engine.py

      - name: Run integrated platform workflow test
        run: python -m pytest backend/tests/test_atlas_platform_workflow.py

      - name: Run Mission Intelligence foundation tests
        run: python -m pytest backend/tests/test_mission_intelligence.py -k "not test_frontend_and_openapi_expose_the_new_capability"

      - name: Run Pilot V1 contract tests
        run: python -m pytest backend/tests/test_pilot_v1_contract.py

      - name: Run Pilot and Mission Intelligence platform tests
        run: python -m pytest backend/tests/test_pilot_platform.py

      - name: Run Learning Inheritance tests
        run: python -m pytest backend/tests/test_learning_inheritance.py

      - name: Run Organizational Learning Evolution tests
        run: python -m pytest backend/tests/test_organizational_learning_evolution.py

      - name: Run Long-Term Memory tests
        run: python -m pytest backend/tests/test_long_term_memory.py

      - name: Check Alembic heads
        run: python -m alembic heads
