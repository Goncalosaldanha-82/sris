name: Remove one-shot pilot repair machinery

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/pilot-release-repair.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Remove temporary repair files
        run: |
          git rm .github/workflows/pilot-release-repair.yml
          git rm tools/pilot_release_repair.py
          git rm tools/pilot_release_repair_post.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-shot pilot repair machinery"
          git push origin HEAD:pilot-v1-september-2026
