name: ATLAS Database Migrations
on:
  workflow_dispatch:
  push:
    branches: [feature/ske-core]
    paths: ["migrations/**", "alembic.ini", "pyproject.toml", "backend/app/atlas_platform/**", "backend/tests/test_alembic_migrations.py"]
permissions:
  contents: read
jobs:
  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest backend/tests/test_alembic_migrations.py
      - run: python -m alembic heads
