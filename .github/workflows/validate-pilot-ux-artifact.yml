name: Validate approved Pilot V1 UX artifact

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/validate-pilot-ux-artifact.yml"
      - "tools/apply_pilot_ux_alignment.py"

permissions:
  contents: read

env:
  ATLAS_DATABASE_URL: sqlite+pysqlite:////tmp/sris-ux-artifact/sris.db
  ATLAS_REPOSITORY_ROOT: /tmp/sris-ux-artifact/repository
  ATLAS_JWT_SECRET: sris-ux-artifact-secret-change-before-production
  ATLAS_ENV: test
  SRIS_PILOT_MODE: "true"
  SRIS_PUBLIC_SIGNUP_ENABLED: "true"

jobs:
  validate-artifact:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply approved alignment
        run: |
          python tools/apply_pilot_ux_alignment.py
          python - <<'PY'
          from pathlib import Path

          platform_test = Path("frontend/tests/pilot_platform_contract.test.js")
          source = platform_test.read_text(encoding="utf-8")
          obsolete = "  assert.match(platform,/hospitality_open_innovation/);\n"
          if obsolete not in source:
              raise RuntimeError("Obsolete platform-literal assertion not found")
          platform_test.write_text(source.replace(obsolete, "", 1), encoding="utf-8")

          runtime_test = Path("backend/tests/test_pilot_v1_contract.py")
          source = runtime_test.read_text(encoding="utf-8")
          old = '        "Portefólio persistente",\n'
          new = '        "Histórico persistente deste workspace",\n'
          if old not in source:
              raise RuntimeError("Obsolete mission-portfolio copy assertion not found")
          runtime_test.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          mkdir -p /tmp/sris-ux-artifact/repository
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
      - name: Validate product, data path and regressions
        run: |
          python -m compileall -q backend/app backend/tests migrations
          node --check frontend/pilot-v1/app.js
          node --check frontend/pilot-v1/pilot-platform-v1.js
          node --check frontend/pilot-v1/pilot-value-v1.js
          node --check frontend/pilot-v1/pilot-mission-bridge-v1.js
          node --check frontend/pilot-v1/business-case-v1.js
          node --test frontend/tests/*.test.js
          rm -f /tmp/sris-ux-artifact/sris.db
          python -m alembic upgrade head
          python -m pytest -q backend/tests/test_alembic_migrations.py
          python -m pytest -q backend/tests/test_pilot_v1_contract.py
          python -m pytest -q backend/tests/test_pilot_platform.py
          python -m pytest -q backend/tests/test_pilot_value.py
          python -m pytest -q backend/tests/test_pilot_business_case.py
          python -m pytest -q backend/tests/test_pilot_tenant_isolation.py
          python -m pytest -q backend/tests/test_identity_lifecycle.py
      - name: Validate PostgreSQL staging upgrade path
        env:
          ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas-ci-password@127.0.0.1:5432/atlas_ci
        run: |
          python -m alembic upgrade 20260827_0022
          python -m alembic upgrade head
          python -m alembic current -v
          python -m alembic heads -v
      - name: Upload validated files
        uses: actions/upload-artifact@v4
        with:
          name: pilot-v1-ux-alignment
          if-no-files-found: error
          path: |
            backend/app/pilot_capabilities.py
            backend/tests/test_pilot_v1_contract.py
            frontend/pilot-v1/demonstracao.html
            frontend/pilot-v1/demonstracao.css
            frontend/pilot-v1/index.html
            frontend/pilot-v1/pilot-platform-v1.js
            frontend/pilot-v1/pilot-value-v1.js
            frontend/tests/public_demonstration_contract.test.js
            frontend/tests/pilot_release_hardening_contract.test.js
            frontend/tests/pilot_platform_contract.test.js
            frontend/tests/pilot_value_contract.test.js
