name: Remove diagnostic artifacts from pilot candidate

on:
  push:
    branches:
      - pilot-v1-september-2026
    paths:
      - ".github/workflows/remove-diagnostic-artifacts.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: pilot-v1-september-2026
          fetch-depth: 0

      - name: Remove diagnostic files and this one-shot workflow
        run: |
          git rm backend/app/_connector_write_probe.tmp
          git rm frontend/pilot-v1/_connector_test.txt
          git rm frontend/pilot-v1/test-upload-path.txt
          git rm .github/workflows/remove-diagnostic-artifacts.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "chore: remove diagnostic connector artifacts"
          git push origin HEAD:pilot-v1-september-2026
