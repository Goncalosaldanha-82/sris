name: SRIS staging public data QA

on:
  push:
    branches:
      - qa-staging-deep-audit-20260902
    paths:
      - ".github/workflows/staging-public-data-qa.yml"
      - "tools/live_staging_public_data_qa.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  SRIS_STAGING_URL: https://sris-pilot-v1-staging.up.railway.app
  QA_OUTPUT_DIR: qa-public-data-artifacts

jobs:
  public-data-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run data and calculation audit
        run: node tools/live_staging_public_data_qa.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sris-staging-public-data-qa-${{ github.run_number }}
          path: qa-public-data-artifacts/
          if-no-files-found: warn
          retention-days: 14
