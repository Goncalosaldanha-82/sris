name: SRIS static security and quality audit

on:
  push:
    branches:
      - qa-staging-deep-audit-20260902
    paths:
      - ".github/workflows/static-security-quality-audit.yml"
      - "tools/static_quality_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit tools and project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
          python -m pip install pip-audit bandit ruff detect-secrets
      - name: Verify Python environment
        run: |
          python -m pip check | tee qa-pip-check.txt
          python -m compileall -q backend/app backend/tests migrations
      - name: Verify every frontend JavaScript file parses
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find frontend/pilot-v1 frontend/tests -type f -name '*.js' -print0)
      - name: Run deterministic static contract audit
        run: python tools/static_quality_audit.py
      - name: Audit Python dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          mkdir -p qa-static-artifacts
          pip-audit --format json --output qa-static-artifacts/pip-audit.json
      - name: Run Bandit application security scan
        continue-on-error: true
        run: |
          bandit -r backend/app -f json -o qa-static-artifacts/bandit.json -ll
      - name: Run Ruff diagnostics
        continue-on-error: true
        run: |
          ruff check backend/app backend/tests --output-format=json > qa-static-artifacts/ruff.json
      - name: Scan current tree for likely committed secrets
        continue-on-error: true
        run: |
          detect-secrets scan --all-files > qa-static-artifacts/detect-secrets.json
      - name: Summarize machine reports
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa-static-artifacts')
          print('===== MACHINE AUDIT SUMMARY =====')
          for name in ('pip-audit.json','bandit.json','ruff.json','detect-secrets.json'):
              path=root/name
              if not path.exists():
                  print(name, 'missing')
                  continue
              try:
                  data=json.loads(path.read_text())
              except Exception as exc:
                  print(name, 'unreadable', exc)
                  continue
              if name=='pip-audit.json':
                  vulns=sum(len(dep.get('vulns',[])) for dep in data.get('dependencies',[])) if isinstance(data,dict) else 0
                  print(name, 'vulnerabilities=', vulns)
              elif name=='bandit.json':
                  results=data.get('results',[]) if isinstance(data,dict) else []
                  print(name, 'results=',len(results), 'high=',sum(r.get('issue_severity')=='HIGH' for r in results), 'medium=',sum(r.get('issue_severity')=='MEDIUM' for r in results))
              elif name=='ruff.json':
                  print(name, 'diagnostics=',len(data) if isinstance(data,list) else 'unknown')
              else:
                  results=data.get('results',{}) if isinstance(data,dict) else {}
                  print(name, 'files_with_candidates=',len(results))
          print('===== MACHINE AUDIT SUMMARY END =====')
          PY
      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sris-static-security-quality-${{ github.run_number }}
          path: |
            qa-static-artifacts/
            qa-pip-check.txt
          if-no-files-found: warn
          retention-days: 14
