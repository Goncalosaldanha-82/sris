name: Apply human-readable institutional email rendering

on:
  push:
    branches:
      - site-human-readable-email-20260905
    paths:
      - .github/workflows/apply-human-email-rendering.yml
      - tools/apply_human_email_rendering.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: site-human-readable-email-20260905
          fetch-depth: 0

      - name: Apply rendering fix
        run: python tools/apply_human_email_rendering.py

      - name: Run site regression and source checks
        run: |
          python -m unittest -v test_contact_server.py
          python -m py_compile contact_server.py
          grep -F 'data-contact-email' site/index.html
          ! grep -F 'contact@sris.io' site/index.html
          grep -F '["contact", "sris.io"].join("@")' site/site.js
          grep -F 'site.js?v=20260905-human-contact-v2' site/index.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify anonymous rendered email locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=8765 SITE_DIR=site python contact_server.py >/tmp/site-email.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            curl -fsS http://127.0.0.1:8765/health >/dev/null && break
            sleep 0.25
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'pt-PT'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:8765/#contacto',{waitUntil:'networkidle',timeout:30000});
            const rendered=(await page.locator('[data-contact-email]').textContent()||'').trim();
            if(rendered!=='contact@sris.io') throw new Error(`Rendered email=${rendered}`);
            const body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
            if(!body.includes('contact@sris.io')) throw new Error('A human cannot see contact@sris.io');
            await page.screenshot({path:'/tmp/site-contact-mobile.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit deployable fix
        run: |
          git rm .github/workflows/apply-human-email-rendering.yml
          git rm tools/apply_human_email_rendering.py
          git add site/index.html site/site.js test_contact_server.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: render institutional email after Cloudflare processing"
          git push origin HEAD:site-human-readable-email-20260905

      - name: Upload rendered mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-contact-mobile-render
          path: /tmp/site-contact-mobile.png
          if-no-files-found: warn
          retention-days: 14
