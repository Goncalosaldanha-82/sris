name: Fix canonical demonstration asset proxy

on:
  push:
    branches:
      - site-release-90d-measured-mission-20260905
    paths:
      - ".github/workflows/fix-site-demo-logo-proxy.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out site release candidate
        uses: actions/checkout@v4
        with:
          ref: site-release-90d-measured-mission-20260905
          fetch-depth: 0

      - name: Add the missing demonstration logo asset
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('contact_server.py')
          text = path.read_text(encoding='utf-8')
          old = '    "/sris-favicon.svg",\n'
          new = '    "/sris-favicon.svg",\n    "/sris-logo-compact-light.svg",\n'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one proxy asset marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate the complete proxied demonstration surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile contact_server.py
          python -m unittest -q test_contact_server.py
          PORT=8092 SITE_DIR=site python contact_server.py >/tmp/sris-site-logo.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8092/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8092/demonstracao | grep -F '/sris-logo-compact-light.svg'
          curl -fsS -D /tmp/logo-headers http://127.0.0.1:8092/sris-logo-compact-light.svg -o /tmp/logo.svg
          grep -qi 'image/svg+xml' /tmp/logo-headers
          grep -q '<svg' /tmp/logo.svg

      - name: Commit clean correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-site-demo-logo-proxy.yml
          git add contact_server.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: proxy complete demonstration asset set"
          git push origin HEAD:site-release-90d-measured-mission-20260905
