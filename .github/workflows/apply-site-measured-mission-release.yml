name: Prepare SRIS site measured-mission release

on:
  push:
    branches:
      - site-release-90d-measured-mission-20260905
    paths:
      - ".github/workflows/apply-site-measured-mission-release.yml"
      - "tools/apply_site_measured_mission_release.py"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out temporary release branch
        uses: actions/checkout@v4
        with:
          ref: site-release-90d-measured-mission-20260905
          fetch-depth: 0

      - name: Apply exact site changes
        run: python tools/apply_site_measured_mission_release.py

      - name: Validate source and existing tests
        run: |
          python -m py_compile contact_server.py
          python -m unittest -q test_contact_server.py
          python - <<'PY'
          from pathlib import Path
          index = Path('site/index.html').read_text(encoding='utf-8')
          server = Path('contact_server.py').read_text(encoding='utf-8')
          required = (
              '90 dias · 1 missão medida',
              'Até 3 missões estruturadas.',
              'href="/demonstracao"',
              'contact@sris.io',
              'https://sris.io/',
              'DEMO_UPSTREAM_DEFAULT',
              'def _proxy_demo',
          )
          for value in required:
              assert value in index or value in server, value
          forbidden = (
              'href="https://sris-pilot-v1-staging.up.railway.app/demonstracao"',
              '<strong>90 dias</strong><p>Até 3 missões,',
          )
          for value in forbidden:
              assert value not in index, value
          PY

      - name: Exercise site and demo proxy locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=8091 SITE_DIR=site python contact_server.py >/tmp/sris-site.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8091/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8091/ | grep -F '90 dias · 1 missão medida'
          curl -fsS http://127.0.0.1:8091/demonstracao | grep -F 'Demonstração para alojamento'
          curl -fsS http://127.0.0.1:8091/api/mission-intelligence/demo/fictional/missions | grep -F 'DEMO-TA-001'

      - name: Commit clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-site-measured-mission-release.yml
          git rm tools/apply_site_measured_mission_release.py
          git add site/index.html contact_server.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align site pilot scope and canonical demo route"
          git push origin HEAD:site-release-90d-measured-mission-20260905
