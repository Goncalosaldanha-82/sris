services:
  atlas-api:
    build: .
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-change-this-before-production}
      ATLAS_REPOSITORY_ROOT: /workspace
      ATLAS_ENV: ${ATLAS_ENV:-development}
    ports: ["8000:8000"]
    volumes: [".:/workspace"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes: ["atlas_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  atlas_postgres_data:
