[project]
name = "sris-enterprise"
version = "1.3.0"
description = "SRIS enterprise investigation, provenance and organizational learning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
"psycopg2-binary==2.9.10",
"pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "cryptography==44.0.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "boto3==1.35.90",
  "redis==5.2.1",
  "email-validator==2.2.0",
  "alembic==1.14.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
