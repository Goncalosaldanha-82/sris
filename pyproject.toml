[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sris-enterprise"
version = "1.6.0"
description = "SRIS enterprise investigation, provenance and organizational learning platform powered by ATLAS Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "psycopg2-binary>=2.9.10",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "boto3>=1.35.90",
  "redis>=5.2.1",
  "email-validator>=2.2.0",
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "PyJWT>=2.9.0",
  "openai>=2.53.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
atlas-os = "app.atlas_os.cli:main"
atlas-repository-engine = "app.atlas_repository_engine.cli:main"
atlas-knowledge-engine = "app.atlas_knowledge_engine.cli:main"
atlas-chat-bridge = "app.atlas_chat_bridge.cli:main"
atlas-intelligence-core = "app.atlas_intelligence_core.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
exclude = ["frontend*", "migrations*", "docs*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
